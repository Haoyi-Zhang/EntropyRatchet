name: Scientific checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run bounded offline scientific gates
        shell: bash
        run: |
          mkdir -p scientific-output
          ulimit -v 3145728
          ulimit -t 420
          timeout --signal=TERM --kill-after=10s 480s \
            python -B .github/scripts/scientific_checks.py --output scientific-output \
            > scientific-output/whole-run.stdout.txt 2> scientific-output/whole-run.stderr.txt
      - name: Retain raw scientific outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-output
          path: scientific-output/
          if-no-files-found: error
